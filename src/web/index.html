<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nanomind</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(circle at 30% 20%, #1e293b, #0f172a 60%);
        color: #e2e8f0;
      }
      #root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .app {
        width: 100%;
        /* max-width: 1040px; */
        height: 100%;
        display: flex;
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        backdrop-filter: blur(8px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      .sidebar {
        width: 260px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid rgba(148, 163, 184, 0.15);
        background: rgba(15, 23, 42, 0.45);
      }
      .new-chat {
        margin: 1rem;
        padding: 0.65rem 1rem;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 10px;
        background: transparent;
        color: #e2e8f0;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .new-chat:hover {
        background: rgba(148, 163, 184, 0.12);
        border-color: rgba(148, 163, 184, 0.4);
      }
      .history {
        flex: 1;
        overflow-y: auto;
        padding: 0 0.5rem 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .history-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        cursor: pointer;
        color: #cbd5e1;
        transition: background 0.12s ease;
      }
      .history-item:hover {
        background: rgba(148, 163, 184, 0.1);
      }
      .history-item.active {
        background: rgba(79, 70, 229, 0.25);
        color: #fff;
      }
      .history-title {
        flex: 1;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-item .delete {
        border: none;
        background: transparent;
        color: #94a3b8;
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
        padding: 0 0.15rem;
        opacity: 0;
        transition: opacity 0.12s ease, color 0.12s ease;
      }
      .history-item:hover .delete,
      .history-item.active .delete {
        opacity: 1;
      }
      .history-item .delete:hover {
        color: #fca5a5;
      }
      .chat {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-header {
        padding: 1.1rem 1.5rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
      }
      .chat-header h1 {
        margin: 0;
        font-size: 1.4rem;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .chat-subtitle {
        color: #94a3b8;
        font-size: 0.8rem;
      }
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .empty {
        margin: auto;
        color: #64748b;
        font-size: 0.9rem;
      }
      .msg {
        display: flex;
      }
      .msg-user {
        justify-content: flex-end;
      }
      .msg-assistant {
        justify-content: flex-start;
      }
      .bubble {
        max-width: 80%;
        padding: 0.7rem 1rem;
        border-radius: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 0.92rem;
      }
      .msg-user .bubble {
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg-assistant .bubble {
        background: #334155;
        color: #e2e8f0;
        border-bottom-left-radius: 4px;
      }
      .typing {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .typing span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #94a3b8;
        animation: blink 1.2s infinite ease-in-out both;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.3;
        }
        40% {
          opacity: 1;
        }
      }
      .error {
        margin: 0 1.25rem;
        padding: 0.6rem 0.9rem;
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
        border-radius: 10px;
        font-size: 0.85rem;
      }
      .composer {
        display: flex;
        gap: 0.6rem;
        padding: 1rem 1.25rem;
        border-top: 1px solid rgba(148, 163, 184, 0.15);
      }
      .composer textarea {
        flex: 1;
        resize: none;
        max-height: 140px;
        padding: 0.7rem 0.9rem;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: #0f172a;
        color: #e2e8f0;
        font-family: inherit;
        font-size: 0.92rem;
        line-height: 1.4;
      }
      .composer textarea:focus {
        outline: none;
        border-color: #4f46e5;
      }
      .composer button {
        padding: 0 1.4rem;
        border: none;
        border-radius: 10px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        color: #fff;
        transition: opacity 0.15s ease, transform 0.1s ease;
      }
      .composer button:hover:not(:disabled) {
        opacity: 0.9;
      }
      .composer button:active:not(:disabled) {
        transform: scale(0.96);
      }
      .composer button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
